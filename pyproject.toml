[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "hexo-recover"
version = "0.1.0"
description = "Rebuild the Markdown sources of a Hexo blog from its generated HTML, and prove the rebuild is faithful."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "Jason Zhu" }]
keywords = ["hexo", "blog", "markdown", "recovery", "html-to-markdown", "next-theme"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Text Processing :: Markup :: Markdown",
  "Topic :: Utilities",
]
dependencies = [
  "beautifulsoup4>=4.12",
  "lxml>=5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
hexo-recover = "hexo_recover.cli:main"

[project.urls]
Homepage = "https://github.com/Belyenochi/hexo-recover"
Issues = "https://github.com/Belyenochi/hexo-recover/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/hexo_recover"]

[tool.pytest.ini_options]
testpaths = ["tests"]
