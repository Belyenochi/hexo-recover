# Publishes the npm package on a v* tag, through npm's OIDC trusted publishing;
# no token is stored anywhere.
#
# One-time setup: the package must exist first (the initial `npm publish` is
# done by hand), then npmjs.com -> package -> Settings -> Trusted publisher:
# GitHub Actions, repository Belyenochi/hexo-recover, workflow release.yml.
name: Release

on:
  push:
    tags: ["v*"]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci && npm test
      - name: tag must match the package version
        run: |
          v=$(node -p "require('./package.json').version")
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME != package.json v$v"; exit 1; }

  npm:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm publish --provenance --access public
