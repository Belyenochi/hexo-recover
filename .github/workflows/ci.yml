name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  node:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # cheerio 1.2 (via undici) needs the File global that arrived in Node 20;
        # Node 18 is end-of-life anyway.
        node-version: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci
      - run: npm test
      - name: package installs from the tarball and the CLI runs
        run: |
          npm pack --silent
          npm install -g ./hexo-recover-*.tgz
          hexo-recover --version
