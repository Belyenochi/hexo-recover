name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  node:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # cheerio 1.2 (via undici) needs the File global that arrived in Node 20;
        # Node 18 is end-of-life anyway.
        node-version: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci
      - run: npm test
      - name: package installs from the tarball and the CLI runs
        run: |
          npm pack --silent
          npm install -g ./hexo-recover-*.tgz
          hexo-recover --version

  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --extra dev
      - run: uv run pytest -q
      - run: uv build && uv run --with twine twine check dist/*

  # The two implementations must produce byte-identical output for the same
  # input. Runs on the fixture site the tests already build.
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: cd python && uv sync --extra dev
      - run: |
          node -e "import('./test/recover_e2e.test.js')" >/dev/null 2>&1 || true
          node --input-type=module -e "
            import { makeSite } from './test/recover_e2e.test.js';
            import fs from 'node:fs'; fs.rmSync('/tmp/fixture', {recursive:true, force:true}); makeSite('/tmp/fixture');"
          HEXO_RECOVER_PY=python/.venv/bin/hexo-recover node scripts/parity.js /tmp/fixture \
            --url https://fake.example --private 2021/05/19/love=x --drop 2021/08/29/8.22=x
